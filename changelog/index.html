<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>WISERA Docs</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />
        <style>
            .staticrypt-hr { margin-top: 20px; margin-bottom: 20px; border: 0; border-top: 1px solid rgba(250,155,13,0.3); }
            .staticrypt-page { width: 360px; padding: 8% 0 0; margin: auto; box-sizing: border-box; }
            .staticrypt-form {
                position: relative; z-index: 1; background: #ffffff;
                max-width: 360px; margin: 0 auto 100px; padding: 45px;
                text-align: center; border-radius: 12px;
                box-shadow: 0 0 20px 0 rgba(0,0,0,0.15), 0 5px 5px 0 rgba(0,0,0,0.1);
            }
            .staticrypt-form input[type="password"], input[type="text"] {
                background: inherit; border: 0; box-sizing: border-box;
                font-size: 14px; outline: 0; padding: 15px 30px 15px 15px; width: 100%;
            }
            .staticrypt-password-container {
                position: relative; outline: 0; background: #f5f5f5;
                width: 100%; border: 0; margin: 0 0 15px; box-sizing: border-box;
                border-radius: 6px;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 20px; opacity: 60%; padding: 13px;
                position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 20px;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase; outline: 0;
                background: #FA9B0D;
                width: 100%; border: 0; padding: 15px; color: #ffffff;
                font-size: 14px; font-weight: bold; letter-spacing: 1px;
                cursor: pointer; border-radius: 6px;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #e08a00; filter: brightness(100%);
            }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content {
                height: 100%; margin-bottom: 1em;
                background: linear-gradient(135deg, #FA9B0D 0%, #e08a00 100%);
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-instructions { margin-top: -1em; margin-bottom: 1em; }
            .staticrypt-title { font-size: 1.5em; color: #333; }
            .staticrypt-logo { width: 80px; height: 80px; margin-bottom: 16px; }
            label.staticrypt-remember { display: flex; align-items: center; margin-bottom: 1em; }
            .staticrypt-remember input[type="checkbox"] { transform: scale(1.5); margin-right: 1em; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem; vertical-align: text-bottom;
                border: 0.25em solid #FA9B0D; border-right-color: transparent; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"], input[type="text"] { font-size: 16px; }
            }
        </style>
    </head>
